    evidence: [html]
    match: '<(?:link|script)[^>]+\b(?:href|src)="[^"]*/bootstrap(?:@\d[^/"]*/dist/(?:css|js)/bootstrap|/\d+\.\d+\.\d+/(?:css|js)/bootstrap)?(?:\.bundle)?(?:\.min)?\.(?:css|js)"'
    version: '<(?:link|script)[^>]+\b(?:href|src)="[^"]*/bootstrap(?:@|/)(\d+\.\d+\.\d+)/'
    confidence: likely
    implies: null
