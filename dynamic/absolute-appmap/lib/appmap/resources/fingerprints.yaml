    # exact `vue v` / `Vue.js v` words exclude siblings (vue-router, @vue/shared, vuex, pinia).
    match: '(?m)^[ \t]*\*[ \t]*(?:vue|Vue\.js) v\d+\.\d+\.\d+[ \t]*\r?$'
    version: '(?m)^[ \t]*\*[ \t]*(?:vue|Vue\.js) v(\d+\.\d+\.\d+)[ \t]*\r?$'
