    # The "@license React" banner is shared by sibling packages (scheduler, react-is, ...):
    # only banners naming a react / react-dom / jsx-runtime build file count.
    match: '@license React(?: v\d+\.\d+\.\d+)?[ \t]*\r?\n[ \t]*\*[ \t]*react(?:-dom(?:-server)?|-jsx-(?:dev-)?runtime)?(?:\.[a-z]+)?\.(?:production|development|profiling)(?:\.min)?\.js'
    version: '@license React v(\d+\.\d+\.\d+)[ \t]*\r?\n[ \t]*\*[ \t]*react(?:-dom(?:-server)?|-jsx-(?:dev-)?runtime)?(?:\.[a-z]+)?\.(?:production|development|profiling)(?:\.min)?\.js'
    confidence: confirmed
    implies: null
  - tech: React
    category: frontend_framework
    evidence: [script]
    match: '__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED|__CLIENT_INTERNALS_DO_NOT_USE_OR_WARN_USERS_THEY_CANNOT_UPGRADE'
    version: null
