    match: '<script[^>]+\bsrc="[^"]*/jquery(?:[-.@/]\d+\.\d+\.\d+)?(?:\.slim)?(?:\.min)?\.js'
    version: '<script[^>]+\bsrc="[^"]*/jquery(?:-|@|/)(\d+\.\d+\.\d+)(?:/|\.slim|\.min|\.js)'
