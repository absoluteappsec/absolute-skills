    match: '\*\s*Bootstrap v\d+\.\d+\.\d+ \(https?://getbootstrap\.com/?\)'
    version: '\*\s*Bootstrap v(\d+\.\d+\.\d+) \(https?://getbootstrap\.com/?\)'
    confidence: confirmed
    implies: null
  - tech: Bootstrap
