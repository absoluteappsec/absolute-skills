# Technology fingerprint rules for `appmap profile` (lib/appmap/profile/fingerprint.py).
#
# Each rule: tech, category, evidence (kinds), match (regex, Python syntax), version (regex with
# exactly one capture group, or null), confidence (confirmed | likely), implies (list of
# {tech, category}, or null).
#
# Evidence kinds: header ("Name: value" lines), cookie (one cookie name), html, script,
# source_map (the map's source paths), schema, spa, error_page, auth (login summary line:
# "role=... login_type=... auth_ok=... fields=a,b token_headers=x,y").
#
# Confidence: `confirmed` only for an explicit name/version string from an authoritative source
# (header, library banner, debug/error page, schema, generator meta); `likely` for a single
# indirect marker (cookie name, DOM marker, script/stylesheet URL, source-map path). Two distinct
# rules matching the same technology make it confirmed; implied technologies are likely.
#
# Version regexes must be anchored to a banner, header or path form (never a bare "v1.2" or
# `version: "2"` anywhere in a bundle) - app code is full of such strings.
#
# Categories: language, server_framework, frontend_framework, js_library, css_framework,
# web_server, app_server, cdn_proxy, auth, api_style, third_party.

rules:
  # ---------------------------------------------------------------- Python / Django
  - tech: Django
    category: server_framework
    evidence: [cookie]
    match: '^(?:csrftoken|sessionid)$'
    version: null
    confidence: likely
    implies: [{tech: Python, category: language}]
  - tech: Django
    category: server_framework
    evidence: [html, error_page, auth]
    match: 'csrfmiddlewaretoken'
    version: null
    confidence: likely
    implies: [{tech: Python, category: language}]
  - tech: Django
    category: server_framework
    evidence: [error_page, html]
    match: 'DEBUG = True</code> in your\s+Django settings file|<th>Django Version:</th>'
    version: '<th>Django Version:</th>\s*<td>\s*(\d+\.\d+(?:\.\d+)?(?:[a-z]+\d*)?)\s*</td>'
    confidence: confirmed
    implies: [{tech: Python, category: language}]
  - tech: Django
    category: server_framework
    evidence: [html, error_page]
    match: '\|\s*Django site admin</title>|">Django administration</a>'
    version: null
    confidence: confirmed
    implies: [{tech: Python, category: language}]
  - tech: Python
    category: language
    evidence: [error_page, html]
    match: '<th>Python Version:</th>'
    version: '<th>Python Version:</th>\s*<td>\s*(\d+\.\d+\.\d+)\s*</td>'
    confidence: confirmed
    implies: null
  - tech: Django REST Framework
    category: server_framework
    evidence: [html, error_page, schema]
    match: 'Django REST framework</(?:a|title)>|/static/rest_framework/'
    version: null
    confidence: confirmed
    implies: [{tech: Django, category: server_framework}, {tech: Python, category: language}]
  - tech: drf-spectacular
    category: server_framework
    evidence: [html, schema]
    match: 'drf[-_]spectacular'
    version: null
    confidence: confirmed
    implies: &drf
      - {tech: Django REST Framework, category: server_framework}
      - {tech: Django, category: server_framework}
      - {tech: Python, category: language}
  - tech: drf-spectacular
    category: server_framework
    evidence: [schema]
    # drf-spectacular's default session security scheme (`cookieAuth`, cookie `sessionid`).
    match: '(?s)\bcookieAuth\b["'']?\s*:\s*\{?\s*["'']?type["'']?\s*:\s*["'']?apiKey["'']?\s*,?\s*["'']?in["'']?\s*:\s*["'']?cookie["'']?\s*,?\s*["'']?name["'']?\s*:\s*["'']?sessionid\b'
    version: null
    confidence: likely
    implies: *drf

