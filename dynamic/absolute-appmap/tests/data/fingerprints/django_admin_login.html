<!DOCTYPE html>
<html lang="en-us" dir="ltr">
<head>
<title>Log in | Django site admin</title>
<link rel="stylesheet" href="/static/admin/css/base.css">
<link rel="stylesheet" href="/static/admin/css/login.css">
</head>
<body class=" login" data-admin-utc-offset="0">
<div id="header"><div id="branding">
<div id="site-name"><a href="/admin/">Django administration</a></div>
</div></div>
<form action="/admin/login/?next=/admin/" method="post" id="login-form"><input type="hidden" name="csrfmiddlewaretoken" value="<redacted:csrf>">
  <div class="form-row"><label class="required" for="id_username">Username:</label> <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username"></div>
  <div class="form-row"><label class="required" for="id_password">Password:</label> <input type="password" name="password" autocomplete="current-password" required id="id_password"></div>
  <div class="submit-row"><input type="submit" value="Log in"></div>
</form>
</body>
</html>
